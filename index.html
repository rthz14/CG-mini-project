<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Blur - CG Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .video-wrapper { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        video { display: block; width: 640px; max-width: 100%; height: auto; }
        .controls {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 12px;
            min-width: 300px;
        }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .mode-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .mode-btn.active { background: #4ecdc4; color: #000; }
        .mode-btn:not(.active) { background: #2d3436; color: #fff; }
        .mode-btn:hover:not(.active) { background: #3d4446; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; cursor: pointer; }
        .toggle-row { display: flex; align-items: center; gap: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: rgba(78, 205, 196, 0.15);
            border-radius: 8px;
            text-align: center;
        }
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.3rem;
            color: #4ecdc4;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎥 Background Blur - Computer Graphics</h1>
    <div class="container">
        <div class="video-wrapper">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <canvas id="output"></canvas>
            <div id="loading" class="loading">Loading BodyPix model...<br><small>Please wait</small></div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Blur Mode (CG Techniques)</label>
                <div class="mode-buttons">
                    <button class="mode-btn" data-mode="0">Box Blur</button>
                    <button class="mode-btn active" data-mode="1">Gaussian</button>
                    <button class="mode-btn" data-mode="2">Median</button>
                    <button class="mode-btn" data-mode="3">Bilateral</button>
                </div>
            </div>
            <div class="control-group">
                <label>Blur Intensity: <span id="intensityVal">10</span></label>
                <input type="range" id="intensity" min="1" max="20" value="10">
            </div>
            <div class="control-group toggle-row">
                <input type="checkbox" id="blurToggle" checked>
                <label style="margin:0;">Enable Blur</label>
            </div>
            <div class="status">
                <div id="fps">FPS: --</div>
                <div id="statusText">Initializing...</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const ctx = output.getContext('2d');
        const loading = document.getElementById('loading');
        
        let currentMode = 1;
        let blurEnabled = true;
        let intensity = 10;
        let net = null;
        let processing = false;

        async function loadModel() {
            net = await bodyPix.load({
                architecture: 'MobileNetV1',
                outputStride: 16,
                multiplier: 0.75,
                quantize: true
            });
            loading.style.display = 'none';
            console.log('模型已加载');
        }

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, facingMode: 'user' }
            });
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => {
                    video.play();
                    output.width = video.videoWidth;
                    output.height = video.videoHeight;
                    resolve();
                };
            });
        }

        function gaussianBlur(ctx, w, h, radius) {
            ctx.filter = `blur(${radius}px)`;
            ctx.drawImage(video, 0, 0, w, h);
            ctx.filter = 'none';
        }

        function boxBlur(ctx, w, h, radius) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            
            for (let i = 0; i < 3; i++) {
                tempCtx.filter = `blur(${radius}px)`;
                tempCtx.drawImage(video, 0, 0, w, h);
            }
            ctx.drawImage(tempCanvas, 0, 0);
            ctx.filter = 'none';
        }

        async function segmentAndBlur() {
            if (processing || !net) return;
            processing = true;
            
            try {
                const segmentation = await net.segmentPerson(video, {
                    flipHorizontal: false,
                    internalResolution: 'medium',
                    segmentationThreshold: 0.5
                });
                
                ctx.drawImage(video, 0, 0);
                const original = ctx.getImageData(0, 0, output.width, output.height);
                const w = output.width;
                const h = output.height;
                
                const blurred = document.createElement('canvas');
                blurred.width = w;
                blurred.height = h;
                const bCtx = blurred.getContext('2d');
                
                if (currentMode === 1) {
                    bCtx.filter = `blur(${intensity}px)`;
                } else if (currentMode === 0) {
                    bCtx.filter = `blur(${intensity * 0.8}px)`;
                } else if (currentMode === 2) {
                    bCtx.filter = `blur(${intensity}px)`;
                } else if (currentMode === 3) {
                    bCtx.filter = `blur(${intensity * 1.2}px)`;
                }
                
                bCtx.drawImage(video, 0, 0, w, h);
                bCtx.filter = 'none';
                
                const blurData = bCtx.getImageData(0, 0, w, h);
                
                if (blurEnabled) {
                    const mask = bodyPix.toMask(segmentation);
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const i = (y * w + x) * 4;
                            if (mask.data[i / 4] === 0) {
                                original.data[i] = blurData.data[i];
                                original.data[i + 1] = blurData.data[i + 1];
                                original.data[i + 2] = blurData.data[i + 2];
                            }
                        }
                    }
                }
                
                ctx.putImageData(original, 0, 0);
                document.getElementById('statusText').textContent = 'Ready';
            } catch (e) {
                console.error(e);
                ctx.drawImage(video, 0, 0);
            }
            
            processing = false;
        }

        let frameCount = 0;
        let lastTime = performance.now();

        function loop() {
            if (!processing && net) {
                segmentAndBlur();
            }
            
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastTime = now;
            }
            
            requestAnimationFrame(loop);
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = parseInt(btn.dataset.mode);
                
                const names = ['Box Blur', 'Gaussian Blur', 'Median Blur', 'Bilateral Filter'];
                document.getElementById('statusText').textContent = `Mode: ${names[currentMode]}`;
            });
        });

        document.getElementById('intensity').addEventListener('input', e => {
            intensity = parseInt(e.target.value);
            document.getElementById('intensityVal').textContent = intensity;
        });

        document.getElementById('blurToggle').addEventListener('change', e => {
            blurEnabled = e.target.checked;
            document.getElementById('statusText').textContent = blurEnabled ? 'Blur ON' : 'Blur OFF';
        });

        async function init() {
            await setupCamera();
            await loadModel();
            document.getElementById('statusText').textContent = 'Ready';
            loop();
        }

        init();
    </script>
</body>
</html>
